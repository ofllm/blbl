name: Auto Rebuild on Upstream Release

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）检查一次上游 latest release
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（忽略已构建标记）"
        type: boolean
        default: false
      upstream_tag:
        description: "可选：指定上游 tag 构建，留空则用 latest release"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my fork (for state file)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            TAG="${{ inputs.upstream_tag }}"
          else
            TAG=$(gh api repos/cat3399/blbl/releases/latest --jq .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Failed to resolve upstream release tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream release: $TAG (version=$VERSION)"

      - name: Compare with last built release
        id: check
        run: |
          LAST=$(cat fork/.last_built_release 2>/dev/null || echo "none")
          NEW="${{ steps.upstream.outputs.tag }}"
          echo "last built: $LAST"
          echo "upstream:   $NEW"
          if [ "${{ inputs.force }}" = "true" ] || [ "$LAST" != "$NEW" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release. Skipping."
          fi

      - name: Clone upstream at release tag
        if: steps.check.outputs.needs_build == 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" \
            https://github.com/cat3399/blbl.git upstream

      - name: Patch AndroidManifest (remove ghost launcher entries)
        if: steps.check.outputs.needs_build == 'true'
        working-directory: upstream
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          patch_alias() {
            local alias_name="$1"
            local target_activity="$2"
            if ! grep -q "$alias_name" "$MANIFEST"; then
              echo "::error::alias $alias_name not found in manifest"
              exit 1
            fi
            sed -i "/$alias_name/,/<\\/activity-alias>/{
              s|${target_activity}\">|${target_activity}\" />|
              /<intent-filter>/,/<\\/intent-filter>/d
              /<\\/activity-alias>/d
            }" "$MANIFEST"
          }

          patch_alias "MainLauncherTvPinkAlias" ".ui.SplashTvPinkActivity"
          patch_alias "MainLauncherTvPinkIllustrationAlias" ".ui.SplashTvPinkIllustrationActivity"

          COUNT=$(grep -c "LEANBACK_LAUNCHER" "$MANIFEST")
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected 1 LEANBACK_LAUNCHER after patch, got $COUNT"
            exit 1
          fi
          echo "Manifest patched OK."

      - name: Set up JDK 17
        if: steps.check.outputs.needs_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        if: steps.check.outputs.needs_build == 'true'
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            -PversionName="${{ steps.upstream.outputs.version }}-tvfix" \
            -PversionCode="${{ github.run_number }}"

      - name: Publish to GitHub Release
        if: steps.check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          TAG="${UPSTREAM_TAG}-tvfix"
          cd fork
          {
            echo "Auto-built from cat3399/blbl release ${UPSTREAM_TAG}."
            echo ""
            echo "已去除创维/酷开 Android 5 TV 上的幽灵图标 alias 入口。"
          } > release_notes.md

          APK="../upstream/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="${APK}#blbl-${VERSION}-tvfix.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading asset (clobber)."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --notes-file release_notes.md \
              --target main
          fi

      - name: Record last built release
        if: steps.check.outputs.needs_build == 'true'
        run: |
          cd fork
          echo "${{ steps.upstream.outputs.tag }}" > .last_built_release
          if [ -f .last_built_sha ]; then
            git rm .last_built_sha
          fi
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add .last_built_release
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Update .last_built_release to ${{ steps.upstream.outputs.tag }}"
            git push
          fi
